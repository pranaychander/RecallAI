<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecallAI Challenge - Quiz Experience</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#ffdad6",
                    "secondary": "#4edea3",
                    "background": "#13131b",
                    "inverse-surface": "#e4e1ed",
                    "surface-container-high": "#292932",
                    "primary-fixed-dim": "#c0c1ff",
                    "secondary-container": "#00a572",
                    "primary-fixed": "#e1e0ff",
                    "on-primary-fixed": "#07006c",
                    "outline-variant": "#464554",
                    "on-secondary-fixed-variant": "#005236",
                    "on-tertiary": "#472a00",
                    "inverse-primary": "#494bd6",
                    "on-primary-container": "#0d0096",
                    "secondary-fixed": "#6ffbbe",
                    "on-secondary": "#003824",
                    "inverse-on-surface": "#303038",
                    "primary-container": "#8083ff",
                    "secondary-fixed-dim": "#4edea3",
                    "error": "#ffb4ab",
                    "on-error": "#690005",
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-tint": "#c0c1ff",
                    "surface-variant": "#34343d",
                    "on-surface-variant": "#c7c4d7",
                    "tertiary": "#ffb95f",
                    "on-secondary-fixed": "#002113",
                    "on-background": "#e4e1ed",
                    "surface-container": "#1f1f27",
                    "on-tertiary-fixed": "#2a1700",
                    "tertiary-fixed": "#ffddb8",
                    "surface-container-lowest": "#0d0d15",
                    "primary": "#c0c1ff",
                    "surface-bright": "#393841",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "on-surface": "#e4e1ed",
                    "on-tertiary-container": "#3e2400",
                    "surface": "#13131b",
                    "surface-container-low": "#1b1b23",
                    "on-secondary-container": "#00311f",
                    "on-tertiary-fixed-variant": "#653e00",
                    "tertiary-container": "#ca8100",
                    "on-primary": "#1000a9",
                    "outline": "#908fa0",
                    "surface-dim": "#13131b",
                    "error-container": "#93000a",
                    "surface-container-highest": "#34343d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "margin": "32px",
                    "gutter": "24px",
                    "sm": "12px",
                    "xs": "4px",
                    "base": "8px",
                    "lg": "48px",
                    "xl": "80px"
            },
            "fontFamily": {
                    "label-caps": ["Geist"],
                    "label-md": ["Geist"],
                    "body-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "display": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #13131b;
            color: #e4e1ed;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(27, 27, 35, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card:hover {
            background: rgba(192, 193, 255, 0.05);
            border-color: rgba(192, 193, 255, 0.3);
            transform: translateY(-2px);
        }

        .option-card.active {
            background: rgba(192, 193, 255, 0.1);
            border-color: #c0c1ff;
            box-shadow: 0 0 15px rgba(192, 193, 255, 0.15);
        }

        .progress-glow {
            box-shadow: 0 0 10px rgba(78, 222, 163, 0.4);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            background: #292932;
            height: 6px;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #c0c1ff;
            margin-top: -9px;
            box-shadow: 0 0 10px rgba(192, 193, 255, 0.4);
            border: 2px solid #13131b;
        }

        .primary-gradient-btn {
            background: linear-gradient(135deg, #494bd6 0%, #c0c1ff 100%);
            position: relative;
            overflow: hidden;
        }

        .primary-gradient-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Progress: Slim bar at the very top -->
<div class="fixed top-0 left-0 w-full h-1.5 bg-surface-container z-[100]">
<div class="h-full bg-secondary progress-glow transition-all duration-700 ease-out" id="quiz-progress" style="width: 65%;"></div>
</div>
<!-- Navigation Shell (Suppressed contextually, using TopAppBar logic for identity) -->
<header class="bg-background/80 backdrop-blur-xl border-b border-white/10 shadow-sm shadow-primary/5 sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-margin py-4 max-w-[1440px] mx-auto">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary" data-icon="brain">drive_file_rename</span>
<span class="font-display text-headline-md font-bold text-primary tracking-tight">RecallAI</span>
</div>
<div class="flex items-center gap-md">
<span class="font-label-md text-label-md text-on-surface-variant">Question 13 of 20</span>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</div>
</div>
</header>
<!-- Main Challenge Canvas -->
<main class="flex-grow flex items-center justify-center px-margin py-lg relative overflow-hidden">
<!-- Subtle Ambient Background Shader -->

<div class="max-w-3xl w-full z-10">
<!-- Distraction-free, centered card -->
<div class="glass-card rounded-[32px] p-lg md:p-xl flex flex-col items-center">
<!-- Category Chip -->
<div class="mb-md px-4 py-1.5 rounded-full bg-primary/10 border border-primary/20">
<span class="font-label-caps text-label-caps text-primary">JAVASCRIPT FUNDAMENTALS</span>
</div>
<!-- Question Title -->
<h1 class="font-headline-lg text-headline-lg text-center mb-xl text-on-surface leading-tight">
                    What is the primary difference between a closure and a nested function?
                </h1>
<!-- Large, clean option cards -->
<div class="grid grid-cols-1 gap-4 w-full">
<button class="option-card group flex items-center justify-between p-md border border-white/10 rounded-xl text-left bg-surface-container-low" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors border border-white/5">A</div>
<span class="font-body-lg text-body-lg text-on-surface">A closure maintains access to its outer scope even after the outer function has returned.</span>
</div>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="option-card group flex items-center justify-between p-md border border-white/10 rounded-xl text-left bg-surface-container-low" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors border border-white/5">B</div>
<span class="font-body-lg text-body-lg text-on-surface">Nested functions can only be defined once, whereas closures can be defined multiple times.</span>
</div>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="option-card group flex items-center justify-between p-md border border-white/10 rounded-xl text-left bg-surface-container-low" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors border border-white/5">C</div>
<span class="font-body-lg text-body-lg text-on-surface">Closures require the "use strict" directive to function properly in modern engines.</span>
</div>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
<!-- Confidence slider at the bottom -->
<div class="mt-xl w-full max-w-md pt-lg border-t border-white/5">
<div class="flex justify-between items-center mb-xs">
<label class="font-label-md text-label-md text-on-surface-variant">How confident are you?</label>
<span class="font-label-md text-label-md text-primary" id="confidence-value">50%</span>
</div>
<input class="w-full" id="confidence-slider" max="100" min="0" oninput="updateConfidence(this.value)" type="range" value="50"/>
<div class="flex justify-between mt-2">
<span class="font-label-caps text-label-caps text-outline opacity-50">GUESSING</span>
<span class="font-label-caps text-label-caps text-outline opacity-50">CERTAIN</span>
</div>
</div>
</div>
</div>
</main>
<!-- Footer: Navigation actions -->
<footer class="bg-surface-container-lowest border-t border-outline-variant/30 py-md px-margin z-50">
<div class="max-w-7xl mx-auto flex justify-between items-center w-full">
<button class="flex items-center gap-xs px-md py-3 text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md">
<span class="material-symbols-outlined" data-icon="fast_forward">fast_forward</span>
                Skip Question
            </button>
<div class="flex gap-md">
<button class="px-xl py-3 rounded-full primary-gradient-btn text-on-primary font-label-md text-label-md shadow-lg shadow-primary/20 hover:brightness-110 active:scale-95 transition-all flex items-center gap-xs">
                    Next Question
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</footer>
<script>
        function selectOption(element) {
            // Remove active class from all options
            document.querySelectorAll('.option-card').forEach(opt => {
                opt.classList.remove('active');
                opt.querySelector('.material-symbols-outlined').classList.add('opacity-0');
            });
            
            // Add active class to selected option
            element.classList.add('active');
            element.querySelector('.material-symbols-outlined').classList.remove('opacity-0');
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        function updateConfidence(val) {
            const display = document.getElementById('confidence-value');
            display.innerText = val + '%';
            
            // Visual shift in color based on confidence
            if(val > 80) {
                display.style.color = '#4edea3'; // secondary/success
            } else if(val < 30) {
                display.style.color = '#ffb4ab'; // error
            } else {
                display.style.color = '#c0c1ff'; // primary
            }
        }

        // Animated progress bar entry
        window.addEventListener('load', () => {
            const progressBar = document.getElementById('quiz-progress');
            progressBar.style.width = '0%';
            setTimeout(() => {
                progressBar.style.width = '65%';
            }, 100);
        });
    </script>
</body></html>
